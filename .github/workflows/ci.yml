name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # transformers is needed by the GQA expansion test, which compares
          # our expand_kv against HF's repeat_kv. That comparison is the guard
          # against every GQA number being silently wrong, so it runs on every
          # push rather than being deferred to the slow job.
          pip install "numpy<2.0" scipy matplotlib pandas tqdm pytest transformers pyflakes pillow

      - name: Lint
        run: python -m pyflakes xsac scripts tests data/prepare.py

      - name: Self-tests (the Day-1 gate; all ten must pass)
        run: python scripts/selftest_arms.py --json results/selftest.json

      - name: A4 recompute
        run: python scripts/a4_recompute.py

      - name: Unit tests
        run: python -m pytest tests/ -q -m "not slow"

      - name: End-to-end smoke factorial
        run: |
          python data/prepare.py --synthetic
          python scripts/run_factorial.py --smoke --seeds 42 1337
          python scripts/make_figures.py

      # Spec section 11 forbids colour as the only separation between series.
      # The palette previously put two arms 0.001 apart in luminance, which is
      # invisible in print, so this is enforced rather than reviewed.
      - name: Figures survive greyscale
        run: python scripts/check_figures.py

      - name: Tables regenerate from results
        run: python scripts/make_tables.py

      - name: Worked example runs on CPU
        run: python examples/audit_your_method.py

      - name: Day-1 gate
        run: python scripts/verify_day.py 1

  slow:
    # Network downloads. Not on every push.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy<2.0" scipy matplotlib pandas tqdm pytest transformers
      - name: Tests needing model downloads
        run: python -m pytest tests/ -q -m "slow"
