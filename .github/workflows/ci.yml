name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy<2.0" scipy matplotlib pandas tqdm pytest

      - name: Self-tests (the Day-1 gate; all ten must pass)
        run: python scripts/selftest_arms.py --json results/selftest.json

      - name: A4 recompute
        run: python scripts/a4_recompute.py

      - name: Unit tests
        run: python -m pytest tests/ -q -m "not slow"

      - name: End-to-end smoke factorial
        run: |
          python data/prepare.py --synthetic
          python scripts/run_factorial.py --smoke --seeds 42 1337
          python scripts/make_figures.py

      - name: Day-1 gate
        run: python scripts/verify_day.py 1

  slow:
    # Network downloads. Not on every push.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy<2.0" scipy matplotlib pandas tqdm pytest transformers
      - name: Tests needing model downloads
        run: python -m pytest tests/ -q -m "slow"
